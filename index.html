<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bài học tương tác Phân loại và xử lý lỗi – Nhóm lỗi 1 An toàn PCCC – Bộ phận Đào tạo Ba Sao">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Xử Lý Lỗi PCCC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Lato:wght@400;700&display=swap">
<style>
/* Layout: thanh thương hiệu xanh cố định + 4 chặng học dạng tab; mỗi chặng là một màn hình gọn, đọc tốt trên điện thoại */
:root{
  --brand:#006838; --brand-ink:#004d2a; --brand-soft:#e6f2ec;
  --accent:#ff7300; --alert:#e61e1e;
  --bg:#f5f8f6; --surface:#ffffff; --fg:#1b2a22; --muted:#55665c; --line:#d6e2db;
  --m1:#e61e1e; --m1-soft:#fde8e8;
  --m2:#ff7300; --m2-soft:#fff0e3;
  --m3:#c99400; --m3-soft:#fff7dc;
  --m4:#2e8b57; --m4-soft:#e5f4ea;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --bad:#e61e1e; --bad-soft:#fde8e8;
  --head:"Montserrat","Lato",system-ui,sans-serif;
  --body:"Lato","Montserrat",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#2fa36a; --brand-ink:#7fd0a6; --brand-soft:#16271e;
  --accent:#ff8a2b; --alert:#ff5a5a;
  --bg:#0f1713; --surface:#17221c; --fg:#e7efe9; --muted:#9fb2a7; --line:#2a3a31;
  --m1:#ff5a5a; --m1-soft:#3a1717; --m2:#ff8a2b; --m2-soft:#3a2412;
  --m3:#e8b923; --m3-soft:#352c10; --m4:#4fbf7f; --m4-soft:#16301f;
  --ok:#4fbf7f; --ok-soft:#16301f; --bad:#ff5a5a; --bad-soft:#3a1717; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#2fa36a; --brand-ink:#7fd0a6; --brand-soft:#16271e;
  --accent:#ff8a2b; --alert:#ff5a5a;
  --bg:#0f1713; --surface:#17221c; --fg:#e7efe9; --muted:#9fb2a7; --line:#2a3a31;
  --m1:#ff5a5a; --m1-soft:#3a1717; --m2:#ff8a2b; --m2-soft:#3a2412;
  --m3:#e8b923; --m3-soft:#352c10; --m4:#4fbf7f; --m4-soft:#16301f;
  --ok:#4fbf7f; --ok-soft:#16301f; --bad:#ff5a5a; --bad-soft:#3a1717; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--head);text-wrap:balance;margin:0;line-height:1.25}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#006838;color:#fff}
.bar-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.bar-t{flex:1;min-width:0}
.bar-t small{display:block;font-family:var(--head);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.bar-t b{font-family:var(--head);font-size:17px}
.logo{width:46px;height:46px;border-radius:50%;flex:none}
.tabs{max-width:980px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 14px;font-family:var(--head);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:#fff;color:#006838}
.tab .n{opacity:.7;margin-right:4px}

main{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:24px 56px}
.screen{display:grid;gap:22px}
.eyebrow{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.lead{color:var(--muted);max-width:62ch;margin:6px 0 0}
.h1{font-size:clamp(26px,5vw,36px);font-weight:800}
.h2{font-size:22px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* Intro */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center}
.hero img{width:100%;border-radius:14px;aspect-ratio:16/9;object-fit:cover;display:block}
.goal{border-left:4px solid var(--brand);padding:2px 0 2px 14px;margin-top:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.route{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.route div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.route b{font-family:var(--head);display:block;font-size:15px}
.route span{font-size:14px;color:var(--muted)}
.route i{font-style:normal;font-family:var(--head);font-weight:800;color:var(--accent);font-size:14px}

/* Câu hỏi */
.q{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:start}
.q-img{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;place-items:center;min-height:200px}
.q-img img{max-height:240px;width:auto;border-radius:8px;display:block}
.q-body{min-width:0;display:grid;gap:14px}
.sit{font-size:19px;font-weight:700;font-family:var(--head);line-height:1.4}
.where{font-size:14px;color:var(--muted)}
.ask{font-family:var(--head);font-weight:700;font-size:15px;color:var(--brand-ink);display:flex;gap:8px;align-items:center}
.ask .step{background:var(--brand);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:56px;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt[disabled]{cursor:default}
.opt .dot{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:13px;color:#fff}
.opt .tx{min-width:0}
.opt .tx b{font-family:var(--head);font-size:15px;display:block}
.opt .tx span{font-size:14px;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.fb{border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fb.good{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.miss{background:var(--bad-soft);border:1px solid var(--bad)}
.fb h4{font-size:16px}
.fb p{margin:0}
.tip{font-size:15px;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.tip b{color:var(--accent)}
.prog{display:flex;align-items:center;gap:12px}
.prog .track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog .fill{height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.prog span{font-family:var(--head);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}

.btn{border:0;border-radius:12px;padding:13px 22px;font-family:var(--head);font-weight:700;font-size:15px;cursor:pointer;background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--brand);color:var(--brand-ink)}
.btn.orange{background:#ff7300;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Nguyên tắc */
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;counter-reset:s}
.steps4 div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative}
.steps4 div::before{counter-increment:s;content:"0" counter(s);font-family:var(--head);font-weight:800;color:var(--brand);font-size:22px;display:block}
.steps4 b{font-family:var(--head);display:block}
.steps4 span{font-size:14px;color:var(--muted)}
.five{display:flex;flex-wrap:wrap;gap:8px}
.five div{flex:1 1 160px;background:var(--brand-soft);border-radius:10px;padding:10px 12px}
.five b{font-family:var(--head);font-size:14px;color:var(--brand-ink);display:block}
.five span{font-size:14px}

.ladder{display:grid;gap:10px}
.lv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.lv-tag{width:86px;display:grid;place-content:center;text-align:center;color:#fff;font-family:var(--head);padding:10px}
.lv-tag b{font-size:28px;line-height:1}
.lv-tag small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.lv-main{padding:14px 16px;display:grid;gap:8px;min-width:0}
.lv-q{font-family:var(--head);font-weight:700;font-size:16px}
.lv-do{display:flex;flex-wrap:wrap;gap:6px}
.lv-do span{font-size:13px;font-family:var(--head);font-weight:600;border-radius:6px;padding:3px 9px}
.lv-time{font-weight:700;font-family:var(--head);font-size:14px}
.lv details summary{cursor:pointer;font-size:14px;color:var(--brand-ink);font-weight:700}
.lv details ul{margin:8px 0 0;padding-left:20px;font-size:15px}
.ask-order{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.ask-order ol{margin:10px 0 0;padding-left:22px;display:grid;gap:6px}

.m1{--c:var(--m1);--cs:var(--m1-soft)} .m2{--c:var(--m2);--cs:var(--m2-soft)}
.m3{--c:var(--m3);--cs:var(--m3-soft)} .m4{--c:var(--m4);--cs:var(--m4-soft)}
.bgc{background:var(--c)} .softc{background:var(--cs);color:var(--fg)}

/* Kết quả */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:130px;height:130px;flex:none}
.ring text{font-family:var(--head);font-weight:800;fill:var(--fg)}
.review{display:grid;gap:10px}
.rv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.rv img{width:72px;height:60px;object-fit:cover;border-radius:8px}
.rv p{margin:0;font-size:15px}
.badge{display:inline-block;font-family:var(--head);font-weight:700;font-size:12px;border-radius:6px;padding:2px 8px;color:#fff;background:var(--c)}

/* Tra cứu */
.tools{display:grid;gap:10px}
.search{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.search:focus{border-color:var(--brand);outline:none}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-family:var(--head);font-weight:600;font-size:14px;cursor:pointer}
.fchip[aria-pressed="true"]{border-color:var(--c,var(--brand));background:var(--cs,var(--brand-soft))}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;overflow:hidden}
.item .stripe{align-self:stretch;background:var(--c)}
.item b{font-family:var(--body);font-weight:700;font-size:16px;display:block}
.item small{color:var(--muted);font-size:13px}
.item .when{font-family:var(--head);font-weight:700;font-size:13px;text-align:right;color:var(--c);white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:24px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields label{display:grid;gap:6px;font-family:var(--head);font-weight:700;font-size:14px;min-width:0}
.err{color:var(--bad);font-weight:700;margin:8px 0 0}
.who-done{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:6px}
.who-done p{margin:0;font-size:18px}
.btn.sm{padding:8px 14px;font-size:13px}
a.btn{text-decoration:none;display:inline-block}
@media (max-width:760px){.fields{grid-template-columns:1fr}}
.sent{color:var(--ok);font-weight:700}
.src{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

@media (max-width:760px){
  .hero,.q{grid-template-columns:1fr}
  .steps4{grid-template-columns:1fr 1fr}
  .route{grid-template-columns:1fr}
  .q-img{min-height:0}
  .q-img img{max-height:190px}
  .item{grid-template-columns:6px minmax(0,1fr)}
  .item .when{grid-column:2;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function rResult(){
  const n=SC.length, good=SC.filter((s,k)=>state.results[k] && state.results[k].l===s.lv && state.results[k].a===s.lv).length;
  const pass=good/n>=0.8, pct=(good/n*100).toFixed(1).replace(".",",");
  const C=2*Math.PI*52, off=C*(1-good/n);
  const wrong=SC.map((s,k)=>({s,r:state.results[k]})).filter(x=>!(x.r.l===x.s.lv&&x.r.a===x.s.lv));
  app.innerHTML = `<section class="screen">
    <div class="panel score">
      <svg class="ring" viewBox="0 0 130 130" role="img" aria-label="Đúng ${good} trên ${n} tình huống">
        <circle cx="65" cy="65" r="52" fill="none" stroke="var(--line)" stroke-width="12"/>
        <circle cx="65" cy="65" r="52" fill="none" stroke="${pass?"var(--ok)":"var(--accent)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"/>
        <text x="65" y="72" text-anchor="middle" font-size="26">${good}/${n}</text>
      </svg>
      <div style="min-width:0;flex:1">
        <div class="eyebrow">Kết quả của ${esc(state.name)} · ${esc(state.kitchen)}</div>
        <h2 class="h1">${pass?"Đạt! Anh/chị xếp mức và xử lý lỗi PCCC rất vững.":"Chưa đạt, mình luyện thêm một lượt nhé."}</h2>
        <p class="lead">Đúng cả 2 bước: ${good}/${n} tình huống (${pct}%). Mức đạt: 80%.</p>
      </div>
    </div>
    ${wrong.length?`<div><h3 class="h2">Xem lại ${wrong.length} tình huống chưa đúng</h3></div>
    <div class="review">${wrong.map(({s,r})=>`<div class="rv"><img src="${IMG[s.img]}" alt=""><div style="min-width:0"><p><b>${s.sit}</b></p><p>Đáp án: <span class="badge m${s.lv}">Mức ${s.lv}</span> · ${LV[s.lv].act.join(" → ")}. Anh/chị chọn: Mức ${r.l}${r.a!==s.lv?", cách xử lý của Mức "+r.a:""}.</p></div></div>`).join("")}</div>`:""}
    <div class="panel" id="send"><b>Bước cuối: nộp kết quả cho Bộ phận Đào tạo.</b>
      <p style="margin:6px 0 0">Bấm nút dưới đây. Một trang mới mở ra và báo <i>“Câu trả lời của bạn đã được ghi lại”</i> (hoặc <i>“Your response has been recorded”</i>) là nộp xong.</p>
      <div class="row" style="margin-top:12px" id="sendRow"><span class="where">Đang chuẩn bị kết quả…</span></div></div>
    <div class="row"><button class="btn ghost" id="again">Làm lại từ đầu</button><button class="btn ghost" id="toLearn2">Xem lại nguyên tắc</button></div>
  </section>`;
  document.getElementById("again").onclick=()=>{state.i=0;state.results=[];state.sentAt=null;state.link="";state.pick1=state.pick2=null;rPractice();};
  document.getElementById("toLearn2").onclick=()=>go("learn");
  buildSend(good,n,pass,pct);
}

async function sha(s){
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,8).toUpperCase();
}
async function buildSend(good,n,pass,pct){
  const row=document.getElementById("sendRow"); if(!row) return;
  const detail=SC.map((s,k)=>{const r=state.results[k]||{};return `TH${k+1}:${r.l===s.lv&&r.a===s.lv?"Đ":"S"}(M${r.l}/${r.a})`;}).join("; ");
  const score=`${good}/${n}`;
  let code="";
  try{ code=await sha([SALT,state.name.trim(),state.kitchen.trim(),score,detail].join("|")); }catch(e){ code="KHONG-TAO-DUOC"; }
  if(!state.link){
    const p=new URLSearchParams();
    const add=(id,v)=>{ if(id) p.append("entry."+id, v); };
    add(FORM.name,state.name.trim()); add(FORM.kitchen,state.kitchen.trim()); add(FORM.score,score);
    add(FORM.pct,pct+"%"); add(FORM.status,pass?"Đạt":"Chưa đạt"); add(FORM.detail,detail); add(FORM.code,code);
    p.append("submit","Submit");
    state.link=FORM.url+"?"+p.toString();
  }
  const draw=()=>{
    row.innerHTML = state.sentAt
      ? `<span class="sent">✓ Đã nộp lúc ${state.sentAt}. Mã bài: <b>${code}</b></span><a class="btn ghost sm" href="${state.link}" target="_blank" rel="noopener" id="sendBtn">Nộp lại</a>`
      : `<a class="btn orange" href="${state.link}" target="_blank" rel="noopener" id="sendBtn">Nộp kết quả →</a><span class="where">Mã bài: ${code}</span>`;
    document.getElementById("sendBtn").addEventListener("click",()=>{
      const d=new Date(); state.sentAt=d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})+" "+d.toLocaleDateString("vi-VN");
      setTimeout(draw,50);
    });
  };
  draw();
}

render();
</script>
